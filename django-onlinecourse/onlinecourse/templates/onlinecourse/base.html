<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OnlineCourse{% endblock %} · OnlineCourse Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --ink: #173244; --muted: #6b7b88; --blue: #2355c4; --bg: #f7f9fc; }
  body { font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  .navbar-academy { background:#fff; border-bottom:1px solid #e7ebf2; }
  .brand { letter-spacing:-.5px; font-weight:800; font-size:1.35rem; }
  .brand .dot { color:#4263df; }
  .content-wrap { max-width:1080px; }
  .muted-label { font-weight:800; color:#516da6; letter-spacing:1.8px; text-transform:uppercase; font-size:.74rem; }
  .heading { font-weight:800; letter-spacing:-1.5px; }
  .card { border:1px solid #e6ebf2; box-shadow:0 14px 30px rgba(35,54,83,.04); border-radius:16px; }
  .btn-primary { background:var(--blue); border-color:var(--blue); }
  .btn { border-radius:9px; font-weight:650; }
  .soft-badge { color:#4966af; background:#eaf0ff; border-radius:999px; font-size:.78rem; padding:.45rem .8rem; }
  .hero-panel { background:linear-gradient(112deg,#162c60,#304ca2); border-radius:18px; color:white; padding:2.6rem; }
  .form-check { margin: .7rem 0; padding: .8rem 1rem .8rem 2.3rem; border:1px solid #e8edf3; border-radius:10px; }
  .form-check-input { margin-left:-1.3rem; }
</style>
</head>
<body>
<nav class="navbar navbar-academy py-3"><div class="container content-wrap d-flex justify-content-between align-items-center">
<a class="navbar-brand brand" href="{% url 'onlinecourse:index' %}">OnlineCourse<span class="dot">.</span></a>
<div class="d-flex align-items-center gap-3">
{% if user.is_authenticated %}<span class="text-secondary small">Hello, {{ user.username }}</span><a class="btn btn-outline-secondary btn-sm" href="{% url 'onlinecourse:logout' %}">Log out</a>
{% else %}<a class="btn btn-outline-primary btn-sm" href="{% url 'onlinecourse:login' %}">Log in</a><a class="btn btn-primary btn-sm" href="{% url 'onlinecourse:registration' %}">Sign up</a>{% endif %}
</div></div></nav>
<main class="container content-wrap py-5">{% block content %}{% endblock %}</main>
</body></html>
