{% extends 'onlinecourse/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:460px"><div class="card"><div class="card-body p-5"><h1 class="h3 fw-bold mb-4">Sign up for OnlineCourse</h1>
{% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
<form method="post">{% csrf_token %}
<label class="form-label">First name</label><input class="form-control mb-3" name="firstname">
<label class="form-label">Last name</label><input class="form-control mb-3" name="lastname">
<label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-4" type="password" name="psw" minlength="8" required>
<button class="btn btn-primary w-100">Register</button></form></div></div></div>{% endblock %}
