name: Fullstack Capstone Lint

on:
  push:
    branches: [main]
    paths:
      - 'fullstack-capstone/**'
      - '.github/workflows/fullstack-lint.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff
      - name: Run Linter
        run: |
          ruff check --select E4,E7,E9,F63,F7,F82 \
            fullstack-capstone/server/djangoapp \
            fullstack-capstone/server/djangoproj

  react-lint:
    name: React Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack-capstone/server/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fullstack-capstone/server/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Linter
        run: |
          npx eslint src --ext .js,.jsx --no-eslintrc \
            --env browser,node,es2021 \
            --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' \
            --rule 'no-debugger:error' \
            --rule 'no-unexpected-multiline:error'

  save-lint-evidence:
    name: Save Verified Lint Output
    runs-on: ubuntu-latest
    needs: [python-lint, react-lint]
    if: success()
    steps:
      - name: Record successful lint jobs and their steps
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_RESULT: ${{ needs.python-lint.result }}
          REACT_RESULT: ${{ needs.react-lint.result }}
        run: |
          {
            echo "GitHub Actions workflow: ${GITHUB_WORKFLOW}"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Python Lint result: ${PYTHON_RESULT}"
            echo "React Lint result: ${REACT_RESULT}"
            echo ""
            echo "Actual job steps from GitHub Actions:"
          } > CI-CD.txt
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "Python Lint" or .name == "React Lint") | "Job: \(.name) [\(.conclusion)]\n" + ([.steps[] | "  \(.name): \(.conclusion)"] | join("\n"))' \
            >> CI-CD.txt
          cat CI-CD.txt
      - name: Upload lint evidence for Coursera Question 22
        uses: actions/upload-artifact@v4
        with:
          name: question-22-lint-run-evidence
          path: CI-CD.txt
          if-no-files-found: error
