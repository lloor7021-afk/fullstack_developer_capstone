name: Fullstack Capstone Lint
on:
  push:
    branches: [main]
    paths:
      - 'fullstack-capstone/**'
      - '.github/workflows/fullstack-lint.yml'
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff
      - name: Run Linter
        run: ruff check --select E4,E7,E9,F63,F7,F82 fullstack-capstone/server/djangoapp fullstack-capstone/server/djangoproj

  react-lint:
    name: React Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack-capstone/server/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fullstack-capstone/server/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Linter
        run: npx eslint src --ext .js,.jsx --no-eslintrc --env browser,node,es2021 --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-debugger:error'
